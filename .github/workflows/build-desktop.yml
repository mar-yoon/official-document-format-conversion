name: Build desktop downloads

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop.py'
      - 'formatter.py'
      - 'templates/**'
      - 'assets/**'
      - 'build_desktop.py'
      - '.github/workflows/build-desktop.yml'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            artifact: gongwen-macOS-arm64
            file: dist/公文格式助手-macOS-arm64.zip
          - os: macos-15-intel
            artifact: gongwen-macOS-x86_64
            file: dist/公文格式助手-macOS-x86_64.zip
          - os: windows-latest
            artifact: gongwen-Windows
            file: dist/公文格式助手-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install pyinstaller==6.22.3
      - name: Build application
        run: python build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
